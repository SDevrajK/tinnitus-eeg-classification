# Central configuration for Tinnitus EEG Phase 2 preprocessing.
# All configurable parameters (channel mapping, thresholds, flags, paths) live here.

channel_mapping:
  # Dataset A — torres_torres (32 channels). Native labels already standard;
  # case-normalize FP->Fp. EOG1/EOG2 are non-scalp and are EXCLUDED (omitted here).
  torres_torres:
    FPz: Fpz
    FP1: Fp1
    FP2: Fp2
    AF7: AF7
    AF3: AF3
    AF4: AF4
    AF8: AF8
