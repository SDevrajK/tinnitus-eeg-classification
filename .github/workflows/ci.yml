name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint scripts/
        run: ruff check --select E9,F63,F7,F82 scripts/
  docker-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t tinnitus-eeg:ci .
      - name: Run tests inside container
        run: docker run --rm tinnitus-eeg:ci conda run -n tinnitus-eeg pytest -q tests/