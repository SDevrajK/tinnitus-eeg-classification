# Phase 2 Tinnitus EEG preprocessing environment
# After creating this environment, install the eeg-processor package in editable mode:
#   pip install -e /home/sdevrajk/projects/personal/eeg-processor

name: tinnitus-eeg
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - mne>=1.7.0
  - neurokit2>=0.2.10
  - numpy>=1.21.0
  - pandas>=1.5.0
  - matplotlib>=3.5.0
  - seaborn>=0.11.0
  - pyyaml>=6.0
  - loguru>=0.7.0
  - scipy>=1.7.0
  - pingouin>=0.5.0
  - jsonschema>=4.0.0
  - psutil>=5.9.0
  - pip
  - pip:
    - asrpy>=0.0.3